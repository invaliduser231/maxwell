name: maxwell-dev

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: maxwell
      POSTGRES_PASSWORD: maxwell
      POSTGRES_DB: maxwell
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "maxwell"]
      interval: 5s
      retries: 10

volumes:
  postgres:
