imagePullSecrets:
  - name: ghcr

existingSecret: ""

secrets:
  fluxerToken: ""
  fluxerClientId: ""
  fluxerClientSecret: ""
  sessionSecret: ""
  fluxerlistApiKey: ""
  twitchClientSecret: ""
  postgresPassword: ""

config:
  defaultPrefix: "m!"
  logLevel: info
  ownerIds: ""
  iconEmojis: ""
  voteUrl: ""
  fluxerlistBotId: ""
  twitchClientId: ""
  fluxerApi: ""
  fluxerWebUrl: https://fluxer.app

bot:
  enabled: true
  image:
    repository: ghcr.io/invaliduser231/maxwell-bot
    tag: ""
    pullPolicy: IfNotPresent
  healthPort: 8080
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  nodeSelector: {}
  tolerations: []

dashboard:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/invaliduser231/maxwell-dashboard
    tag: ""
    pullPolicy: IfNotPresent
  host: ""
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []

ingress:
  enabled: true
  className: ""
  annotations: {}
  tls:
    enabled: true
    secretName: ""

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "18.6"
    pullPolicy: IfNotPresent
  database: maxwell
  user: maxwell
  storage:
    size: 5Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  externalUrl: ""

backup:
  enabled: true
  schedule: "17 3 * * *"
  keep: 14
  s3:
    provider: Other
    endpoint: ""
    region: ""
    path: ""
    existingSecret: ""
  age:
    recipients: ""
    version: v1.3.2
    sha256:
      amd64: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
      arm64: 6b8dc4333c53a5a57c9e5834e3a48f92605d7154014cd07269ff3327db5d37f4
  rclone:
    image:
      repository: rclone/rclone
      tag: "1.75.2"

tunnel:
  enabled: false
  replicas: 2
  existingSecret: ""
  image:
    repository: cloudflare/cloudflared
    tag: "2026.10.7"
