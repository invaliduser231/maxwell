{{- if .Values.bot.enabled }}
{{- $b := .Values.bot }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "maxwell.name" . }}-bot
  labels:
    {{- include "maxwell.labels" . | nindent 4 }}
    app.kubernetes.io/component: bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "maxwell.selector" . | nindent 6 }}
      app.kubernetes.io/component: bot
  template:
    metadata:
      labels:
        {{- include "maxwell.selector" . | nindent 8 }}
        app.kubernetes.io/component: bot
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      terminationGracePeriodSeconds: {{ $b.terminationGracePeriodSeconds }}
      containers:
        - name: bot
          image: {{ include "maxwell.image" $b | quote }}
          imagePullPolicy: {{ $b.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "maxwell.configName" . }}
          env:
            - name: HEALTH_PORT
              value: {{ $b.healthPort | quote }}
            {{- include "maxwell.secretEnv" . | nindent 12 }}
            {{- include "maxwell.databaseEnv" . | nindent 12 }}
          ports:
            - name: health
              containerPort: {{ $b.healthPort }}
          startupProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $b.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $b.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
