{{- if not .Values.existingSecret }}
{{- $name := include "maxwell.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $previous := dict }}
{{- if $existing }}{{ $previous = $existing.data }}{{ end }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "maxwell.labels" . | nindent 4 }}
type: Opaque
data:
  FLUXER_TOKEN: {{ required "secrets.fluxerToken is required" $s.fluxerToken | b64enc | quote }}
  {{- if $s.fluxerClientId }}
  FLUXER_CLIENT_ID: {{ $s.fluxerClientId | toString | b64enc | quote }}
  {{- end }}
  {{- if $s.fluxerClientSecret }}
  FLUXER_CLIENT_SECRET: {{ $s.fluxerClientSecret | b64enc | quote }}
  {{- end }}
  {{- if $s.sessionSecret }}
  SESSION_SECRET: {{ $s.sessionSecret | b64enc | quote }}
  {{- else if hasKey $previous "SESSION_SECRET" }}
  SESSION_SECRET: {{ index $previous "SESSION_SECRET" | quote }}
  {{- else }}
  SESSION_SECRET: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- if $s.dataKey }}
  DATA_KEY: {{ $s.dataKey | b64enc | quote }}
  {{- else if hasKey $previous "DATA_KEY" }}
  DATA_KEY: {{ index $previous "DATA_KEY" | quote }}
  {{- else if and .Release.IsUpgrade (not $existing) }}
  {{- fail "existing secret not readable, set secrets.dataKey explicitly" }}
  {{- else }}
  DATA_KEY: {{ randBytes 32 | b64enc | quote }}
  {{- end }}
  {{- if $s.fluxerlistApiKey }}
  FLUXERLIST_API_KEY: {{ $s.fluxerlistApiKey | b64enc | quote }}
  {{- end }}
  {{- if $s.twitchClientSecret }}
  TWITCH_CLIENT_SECRET: {{ $s.twitchClientSecret | b64enc | quote }}
  {{- end }}
  {{- if $s.postgresPassword }}
  POSTGRES_PASSWORD: {{ $s.postgresPassword | b64enc | quote }}
  {{- else if hasKey $previous "POSTGRES_PASSWORD" }}
  POSTGRES_PASSWORD: {{ index $previous "POSTGRES_PASSWORD" | quote }}
  {{- else if .Release.IsUpgrade }}
  {{- fail "existing secret not readable, set secrets.postgresPassword and secrets.sessionSecret explicitly" }}
  {{- else }}
  POSTGRES_PASSWORD: {{ randAlphaNum 40 | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.postgres.enabled) .Values.postgres.externalUrl }}
  DATABASE_URL: {{ .Values.postgres.externalUrl | b64enc | quote }}
  {{- end }}
{{- end }}
