{{- if and .Values.backup.enabled .Values.postgres.enabled }}
{{- $p := .Values.postgres }}
{{- $b := .Values.backup }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "maxwell.name" . }}-backup
  labels:
    {{- include "maxwell.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ $b.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "maxwell.selector" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          initContainers:
            - name: tools
              image: "{{ $b.rclone.image.repository }}:{{ $b.rclone.image.tag }}"
              imagePullPolicy: IfNotPresent
              env:
                - name: RCLONE_CONFIG
                  value: ""
                - name: AGE_VERSION
                  value: {{ $b.age.version | quote }}
                - name: AGE_SHA256_amd64
                  value: {{ $b.age.sha256.amd64 | quote }}
                - name: AGE_SHA256_arm64
                  value: {{ $b.age.sha256.arm64 | quote }}
              command:
                - sh
                - -ec
                - |
                  cp /usr/local/bin/rclone /etc/ssl/certs/ca-certificates.crt /tools/
                  arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
                  sum=$(printenv "AGE_SHA256_$arch")
                  rclone copyurl "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-$arch.tar.gz" /tmp/age.tgz
                  echo "$sum  /tmp/age.tgz" | sha256sum -c -
                  tar -xzOf /tmp/age.tgz age/age > /tools/age
                  chmod 0755 /tools/age
                  rm /tmp/age.tgz
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tools
                  mountPath: /tools
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: backup
              image: "{{ $p.image.repository }}:{{ $p.image.tag }}"
              imagePullPolicy: {{ $p.image.pullPolicy }}
              env:
                - name: PGHOST
                  value: {{ include "maxwell.postgresHost" . }}
                - name: PGUSER
                  value: {{ $p.user | quote }}
                - name: PGDATABASE
                  value: {{ $p.database | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "maxwell.secretName" . }}
                      key: POSTGRES_PASSWORD
                - name: BACKUP_PATH
                  value: {{ printf ":s3:%s" (required "backup.s3.path is required" $b.s3.path) | quote }}
                - name: RCLONE_CONFIG
                  value: ""
                - name: SSL_CERT_FILE
                  value: /tools/ca-certificates.crt
                - name: RCLONE_S3_PROVIDER
                  value: {{ $b.s3.provider | quote }}
                - name: RCLONE_S3_ENDPOINT
                  value: {{ required "backup.s3.endpoint is required" $b.s3.endpoint | quote }}
                - name: RCLONE_S3_REGION
                  value: {{ $b.s3.region | quote }}
                - name: RCLONE_S3_NO_CHECK_BUCKET
                  value: "true"
                - name: RCLONE_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ required "backup.s3.existingSecret is required" $b.s3.existingSecret }}
                      key: ACCESS_KEY_ID
                - name: RCLONE_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $b.s3.existingSecret }}
                      key: SECRET_ACCESS_KEY
                - name: AGE_RECIPIENTS
                  value: {{ required "backup.age.recipients is required" $b.age.recipients | quote }}
                - name: KEEP
                  value: {{ $b.keep | quote }}
              command:
                - bash
                - -euo
                - pipefail
                - -c
                - |
                  export PATH=/tools:$PATH
                  name=maxwell-$(date -u +%Y%m%d-%H%M%S).dump.age
                  rclone delete "$BACKUP_PATH" --max-depth 1 --include 'maxwell-*.dump.age.part'
                  pg_dump --format=custom --compress=zstd --no-unlogged-table-data \
                    | age -R <(printf '%s\n' "$AGE_RECIPIENTS") \
                    | rclone rcat "$BACKUP_PATH/$name.part"
                  rclone moveto "$BACKUP_PATH/$name.part" "$BACKUP_PATH/$name"
                  rclone lsf --files-only --include 'maxwell-*.dump.age' "$BACKUP_PATH" \
                    | sort -r | tail -n +$((KEEP + 1)) \
                    | while read -r old; do rclone deletefile "$BACKUP_PATH/$old"; done
                  rclone backend cleanup-hidden "$BACKUP_PATH" --checkers 1
                  rclone lsl "$BACKUP_PATH" --max-depth 1
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tools
                  mountPath: /tools
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tools
              emptyDir: {}
            - name: tmp
              emptyDir: {}
{{- end }}
