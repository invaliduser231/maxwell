{{- if and .Values.backup.enabled .Values.postgres.enabled }}
{{- $p := .Values.postgres }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "maxwell.name" . }}-backups
  labels:
    {{- include "maxwell.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.backup.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.storage.size }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "maxwell.name" . }}-backup
  labels:
    {{- include "maxwell.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "maxwell.selector" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
          containers:
            - name: pg-dump
              image: "{{ $p.image.repository }}:{{ $p.image.tag }}"
              imagePullPolicy: {{ $p.image.pullPolicy }}
              env:
                - name: PGHOST
                  value: {{ include "maxwell.postgresHost" . }}
                - name: PGUSER
                  value: {{ $p.user | quote }}
                - name: PGDATABASE
                  value: {{ $p.database | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "maxwell.secretName" . }}
                      key: POSTGRES_PASSWORD
                - name: KEEP_DAYS
                  value: {{ .Values.backup.keepDays | quote }}
              command:
                - /bin/sh
                - -ec
                - |
                  file="/backups/maxwell-$(date -u +%Y%m%d-%H%M%S).dump"
                  pg_dump --format=custom --file="$file.partial"
                  mv "$file.partial" "$file"
                  find /backups -name 'maxwell-*.dump' -mtime +"$KEEP_DAYS" -delete
                  ls -lh /backups
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ include "maxwell.name" . }}-backups
{{- end }}
