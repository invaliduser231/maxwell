{{- if .Values.tunnel.enabled }}
{{- $t := .Values.tunnel }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "maxwell.name" . }}-tunnel
  labels:
    {{- include "maxwell.labels" . | nindent 4 }}
    app.kubernetes.io/component: tunnel
spec:
  replicas: {{ $t.replicas }}
  selector:
    matchLabels:
      {{- include "maxwell.selector" . | nindent 6 }}
      app.kubernetes.io/component: tunnel
  template:
    metadata:
      labels:
        {{- include "maxwell.selector" . | nindent 8 }}
        app.kubernetes.io/component: tunnel
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: cloudflared
          image: "{{ $t.image.repository }}:{{ $t.image.tag }}"
          imagePullPolicy: IfNotPresent
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "tunnel.existingSecret is required" $t.existingSecret }}
                  key: TUNNEL_TOKEN
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
