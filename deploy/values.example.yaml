secrets:
  fluxerToken: "<bot token>"
  fluxerClientId: "<oauth client id>"
  fluxerClientSecret: "<oauth client secret>"
  sessionSecret: ""
  dataKey: ""
  fluxerlistApiKey: ""
  twitchClientSecret: ""
  postgresPassword: ""

config:
  ownerIds: "<your user id>"
  iconEmojis: "<ICON_EMOJIS from .env>"
  voteUrl: ""
  fluxerlistBotId: ""
  twitchClientId: ""

dashboard:
  host: "<dashboard domain>"

ingress:
  className: "<ingress class>"
  annotations: {}
  tls:
    enabled: true
    secretName: ""

postgres:
  storage:
    storageClassName: ""

backup:
  s3:
    endpoint: "<s3 endpoint>"
    region: "<s3 region>"
    path: "<bucket>/postgres"
    existingSecret: "<secret with ACCESS_KEY_ID and SECRET_ACCESS_KEY>"
  age:
    recipients: "<age public key>"

tunnel:
  enabled: false
  existingSecret: "<secret with TUNNEL_TOKEN>"
